[options]
isa rv32imc
nbus 2

[depth]
insn            30
reg       1     20
pc_fwd    1     30
pc_bwd    1     30
liveness  1  20 70
unique    1  20 30
causal    1     30

bus_imem            1    10
bus_imem_fault      1    10
bus_dmem            1    10
bus_dmem_fault      1    10

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define RISCV_FORMAL_MEM_FAULT

[sort]
bus_imem
bus_imem_fault
bus_dmem
bus_dmem_fault

[script-sources]
read_verilog -formal @basedir@/cores/@core@/hdl/*.v
prep -flatten
